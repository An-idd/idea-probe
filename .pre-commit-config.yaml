repos:
  - repo: local
    hooks:
      - id: secret-scan
        name: scan publishable files for secret patterns
        entry: python scripts/secret_scan.py .
        language: system
        pass_filenames: false
        stages: [pre-push]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
